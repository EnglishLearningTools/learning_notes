    <script>
    document.addEventListener('DOMContentLoaded', function () {
      let lastSortedIndex = -1;
      let ascending = true;

      function sortTableByColumn(table, columnIndex, asc) {
        const tbody = table.querySelector('tbody');
        const rows = Array.from(tbody.querySelectorAll('tr'));

        rows.sort(function(a, b) {
          const aText = a.children[columnIndex].innerText.trim();
          const bText = b.children[columnIndex].innerText.trim();

          // Try parsing as date first
          const aDate = Date.parse(aText);
          const bDate = Date.parse(bText);
          let result;
          if (!isNaN(aDate) && !isNaN(bDate)) {
            result = aDate - bDate;
          } else {
            result = aText.localeCompare(bText, 'zh-Hans');
          }

          return asc ? result : -result;
        });

        rows.forEach(row => tbody.appendChild(row));

        // Add sort indicator
        const th = table.querySelectorAll('th')[columnIndex];
        table.querySelectorAll('th').forEach(th => {
          th.textContent = th.textContent.replace(/[▲▼]/g, '').trim();
        });
        th.textContent = th.textContent.trim() + (asc ? ' ▲' : ' ▼');
      }

      const table = document.querySelector('table.sortable');
      if (table) {
        // Default sort by 日期 (2nd column, index 1), descending
        sortTableByColumn(table, 1, false);
        lastSortedIndex = 1;
        ascending = false;
      }

      // Add click event to each column header
      table.querySelectorAll('th').forEach(function(th, index) {
        th.addEventListener('click', function () {
          ascending = (lastSortedIndex === index) ? !ascending : true;
          lastSortedIndex = index;
          sortTableByColumn(table, index, ascending);
        });
      });

      // Global search
      const searchInput = document.getElementById('searchGlobal');
      if (searchInput) {
        searchInput.addEventListener('input', function () {
          const filter = this.value.trim().toLowerCase();
          const rows = document.querySelectorAll('tbody tr');

          rows.forEach(row => {
            const match = Array.from(row.cells).some(td =>
              td.textContent.toLowerCase().includes(filter)
            );
            row.style.display = match ? '' : 'none';
          });
        });
      }
    });
    </script>
