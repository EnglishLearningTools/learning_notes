    <script>
    document.addEventListener('DOMContentLoaded', function () {
      let lastSortedIndex = -1;
      let ascending = true;

      // Sorting logic
      document.querySelectorAll('th').forEach(function(th, index) {
        th.addEventListener('click', function () {
          const table = th.closest('table');
          const tbody = table.querySelector('tbody');
          const rows = Array.from(tbody.querySelectorAll('tr'));

          // Clear sort icons
          table.querySelectorAll('th').forEach(th => {
            th.textContent = th.textContent.replace(/[▲▼]/g, '').trim();
          });

          // Sort rows
          rows.sort(function(a, b) {
            const aText = a.children[index].innerText.trim();
            const bText = b.children[index].innerText.trim();
            const aNum = parseFloat(aText);
            const bNum = parseFloat(bText);

            let result;
            if (!isNaN(aNum) && !isNaN(bNum)) {
              result = aNum - bNum;
            } else {
              result = aText.localeCompare(bText, 'zh-Hans');
            }

            return ascending ? result : -result;
          });

          rows.forEach(row => tbody.appendChild(row));
          th.textContent = th.textContent.trim() + (ascending ? ' ▲' : ' ▼');

          if (lastSortedIndex === index) {
            ascending = !ascending;
          } else {
            ascending = true;
            lastSortedIndex = index;
          }
        });
      });

      // Global search across all table cells
      const searchInput = document.getElementById('searchGlobal');
      if (searchInput) {
        searchInput.addEventListener('input', function () {
          const filter = this.value.trim().toLowerCase();
          const rows = document.querySelectorAll('tbody tr');

          rows.forEach(row => {
            const match = Array.from(row.cells).some(td =>
              td.textContent.toLowerCase().includes(filter)
            );
            row.style.display = match ? '' : 'none';
          });
        });
      }
    });
    </script>
