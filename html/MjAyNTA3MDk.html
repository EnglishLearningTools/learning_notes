    <script>
    document.addEventListener('DOMContentLoaded', function () {
      let lastSortedIndex = -1;
      let ascending = true;

      document.querySelectorAll('th').forEach(function(th, index) {
        th.addEventListener('click', function () {
          const table = th.closest('table');
          const tbody = table.querySelector('tbody');
          const rows = Array.from(tbody.querySelectorAll('tr'));

          // Clear existing sort indicators
          table.querySelectorAll('th').forEach(th => {
            th.textContent = th.textContent.replace(/[▲▼]/g, '').trim();
          });

          // Sort rows
          rows.sort(function(a, b) {
            const aText = a.children[index].innerText.trim();
            const bText = b.children[index].innerText.trim();
            const aNum = parseFloat(aText);
            const bNum = parseFloat(bText);

            let result;
            if (!isNaN(aNum) && !isNaN(bNum)) {
              result = aNum - bNum;
            } else {
              result = aText.localeCompare(bText, 'zh-Hans');
            }

            return ascending ? result : -result;
          });

          // Append sorted rows
          rows.forEach(row => tbody.appendChild(row));

          // Add sort indicator
          th.textContent = th.textContent.trim() + (ascending ? ' ▲' : ' ▼');

          // Toggle sort direction
          if (lastSortedIndex === index) {
            ascending = !ascending;
          } else {
            ascending = true;
            lastSortedIndex = index;
          }
        });
      });
    });
    </script>
